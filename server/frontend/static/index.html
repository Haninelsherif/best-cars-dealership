<!doctype html><html><head><meta charset="utf-8"><title>Best Cars Dealership</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.nav{padding:18px;background:#172033;color:white}.nav a,.nav button{color:white;margin-right:18px;background:none;border:0;text-decoration:none;cursor:pointer}.wrap{max-width:1100px;margin:35px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card,.panel{background:white;padding:22px;border-radius:16px;box-shadow:0 5px 20px #0001}.btn{padding:10px 14px;border:0;border-radius:8px;background:#172033;color:white;cursor:pointer;margin:4px}.field{padding:10px;border:1px solid #ccd3df;border-radius:8px;margin:4px}.hidden{display:none}.review{border-top:1px solid #ddd;padding:12px 0}</style></head><body><nav class="nav"><a href="/">Home</a><a href="/about/">About</a><a href="/contact/">Contact</a><span id="auth"></span></nav><main class="wrap"><h1>Best Cars Dealership</h1><p>Find dealers, filter by state and read customer reviews.</p><div class="panel"><label>Filter by state: </label><select id="state" class="field"><option value="">All States</option><option>KS</option><option>TX</option></select><button class="btn" onclick="loadDealers()">Search</button></div><section id="dealers" class="grid" style="margin-top:20px"></section><section id="detail" class="panel hidden" style="margin-top:25px"></section></main><script>const $=id=>document.getElementById(id);function user(){return sessionStorage.getItem("username")}function renderAuth(){if(user()){$("auth").innerHTML="Logged in as <b>"+user()+"</b> <button onclick='logout()'>Logout</button>"}else{$("auth").innerHTML="<a href='/register/'>Register</a>"}}async function loadDealers(){const st=$("state").value;const url=st?"/getdealersbyState/"+st+"/":"/getalldealers/";const ds=await fetch(url).then(r=>r.json());$("dealers").innerHTML=ds.map(d=>"<div class='card'><h2>"+d.full_name+"</h2><p>"+d.address+", "+d.city+", "+d.st+" "+d.zip+"</p><button class='btn' onclick='details("+d.id+")'>View Reviews</button>"+(user()?"<button class='btn' onclick='postReview("+d.id+")'>Review Dealer</button>":"")+"</div>").join("")}async function details(id){const d=await fetch("/getdealerbyid/"+id+"/").then(r=>r.json());const rs=await fetch("/getdealerreviews/"+id+"/").then(r=>r.json());$("detail").classList.remove("hidden");$("detail").innerHTML="<h2>"+d.full_name+"</h2><p>"+d.address+", "+d.city+", "+d.st+"</p><h3>Reviews</h3>"+rs.map(r=>"<div class='review'><b>"+r.name+"</b> — "+r.sentiment+"<p>"+r.review+"</p></div>").join("")+(user()?"<button class='btn' onclick='postReview("+id+")'>Post Review</button>":"")}function postReview(id){$("detail").classList.remove("hidden");$("detail").innerHTML="<h2>Post Review</h2><textarea id='reviewText' class='field' style='width:90%;height:100px' placeholder='Write your review'></textarea><br><label><input id='purchase' type='checkbox'> I purchased a car</label><br><button class='btn' onclick='submitReview("+id+")'>Submit Review</button>"}async function submitReview(id){const review=$("reviewText").value;const r=await fetch("/addreview/"+id+"/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({review,purchase:$("purchase").checked})});if(r.ok){await details(id);await loadDealers()}else alert((await r.json()).error||"Unable to post review")}async function logout(){await fetch("/logoutuser/");sessionStorage.removeItem("username");renderAuth();loadDealers()}renderAuth();loadDealers();</script></body></html>
